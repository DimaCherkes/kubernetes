server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Expose Frontend Pod name (container hostname in Kubernetes)
    add_header X-Frontend-Pod $hostname always;
    add_header Access-Control-Expose-Headers "X-Frontend-Pod" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Single Page Application routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frontend-Pod $hostname always;
        add_header Access-Control-Expose-Headers "X-Frontend-Pod" always;
    }

    # Static assets caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Frontend-Pod $hostname always;
        add_header Access-Control-Expose-Headers "X-Frontend-Pod" always;
    }

    # Dedicated Kubernetes health check endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-Frontend-Pod $hostname always;
        return 200 'OK';
    }
}
