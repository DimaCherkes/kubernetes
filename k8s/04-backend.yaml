apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: full-stack-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: full-stack-app
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: full-stack-app
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: fullstack-backend:v5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MANAGEMENT_OTLP_TRACING_ENDPOINT
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # --- Elasticsearch (managed by ECK) ---
            # Activates application-k8s.yml (HTTPS + PEM SSL bundle from ECK CA)
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_ELASTICSEARCH_URIS
              value: https://task-search-es-http.full-stack-app.svc:9200
            - name: SPRING_ELASTICSEARCH_USERNAME
              value: elastic
            # Password of the built-in 'elastic' user generated by ECK
            - name: SPRING_ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-search-es-elastic-user
                  key: elastic
            - name: ELASTICSEARCH_CA_CERT
              value: file:/etc/elasticsearch/certs/ca.crt
          volumeMounts:
            - name: es-ca
              mountPath: /etc/elasticsearch/certs
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        # Public HTTP CA certificate published by ECK for the 'task-search' cluster
        - name: es-ca
          secret:
            secretName: task-search-es-http-certs-public
            items:
              - key: ca.crt
                path: ca.crt
